name: Release

# Triggered by pushing a version tag (e.g. v0.2.0) or manually via the GitHub UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write   # required to create/update GitHub releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — produces .deb, .rpm, .AppImage
          - platform: ubuntu-22.04
            args: ''

          # Windows — produces .msi and NSIS .exe
          - platform: windows-latest
            args: ''

          # macOS — universal binary (Intel + Apple Silicon) in one .dmg
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node.js + frontend deps ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both Apple targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # ── Linux system libraries (WebKitGTK 4.1 + AppIndicator) ────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      # ── Tauri build + GitHub release ─────────────────────────────────────────
      # tauri-action runs `beforeBuildCommand` from tauri.conf.json automatically
      # (npm run build in frontend/), then `cargo tauri build`.
      # On a tag push it creates a draft GitHub release and attaches all bundles.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/conduit-tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Conduit ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/deid84/conduit/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
