[workspace]
members = [
    "crates/conduit-core",
    "crates/conduit-api",
    "crates/conduit-tauri",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Davide Ferrero"]

[workspace.dependencies]
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
tokio-serial = "5"
axum = { version = "0.8.9", features = ["ws"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
bytes = "1.12.1"
